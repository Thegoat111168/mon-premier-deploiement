trigger:
- main

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: "Récupération du code de structure de GitHub"

# 1. ÉTAPE EXISTANTE : Génération du rollback
- powershell: |
    Write-Host "=== Connexion a l'IA Locale Ollama - Rollback ==="
    $scriptPath = "$(Build.SourcesDirectory)\scripts\deploy_tables.sql"
    $sqlContent = Get-Content -Path $scriptPath -Raw
    $prompt = "Tu es un expert DBA Oracle Senior. Analyse ce script de déploiement et génère exclusivement le script de rollback (retour en arrière) SQL inverse exact (DROP, DELETE, etc.). Ne mets aucun texte d'explication, pas de blabla, pas de balises Markdown. Renvoie uniquement le code SQL exécutable se terminant par EXIT;`n`nScript à analyser :`n$sqlContent"
    $bodyObj = @{ model = "qwen2.5-coder:14b"; prompt = $prompt; stream = $false }
    $bodyJson = ConvertTo-Json -InputObject $bodyObj -Depth 5 -Compress
    $response = Invoke-RestMethod -Uri "http://localhost:11434/api/generate" -Method Post -ContentType "application/json; charset=utf-8" -Body $bodyJson
    $outputPath = "$(Build.SourcesDirectory)\scripts\rollback_mfa.sql"
    $response.response | Out-File -FilePath $outputPath -Encoding utf8
    Write-Host "=== [SUCCESS] Rollback généré ==="
  displayName: "Génération du plan de secours par IA Locale (Ollama)"

# 2. NOUVELLE ÉTAPE : Le Linter SQL par IA (Version Sécurisée)
- powershell: |
    Write-Host "=== Lancement de l'audit de qualite SQL par l'IA ==="
    
    # Lecture du code SQL à auditer
    $scriptPath = "$(Build.SourcesDirectory)\scripts\deploy_tables.sql"
    $sqlContent = Get-Content -Path $scriptPath -Raw
    
    # Prompt de cadrage strict pour le comportement de Linter
    $prompt = "Tu es un expert en audit de code Oracle PL/SQL et SecOps. Analyse le script SQL fourni pour détecter les failles de sécurité (injections, privilèges trop élevés), les problèmes de performance (index manquants, requêtes lourdes) ou de syntaxe. 
    Règles de réponse :
    1. Si le code respecte parfaitement les bonnes pratiques Oracle, commence obligatoirement ta réponse par le mot exact : VALIDE
    2. Si tu trouves des défauts ou des risques majeurs, commence obligatoirement ta réponse par le mot exact : REFUSE, suivi de la liste claire des problèmes identifiés.
    
    Script à analyser :
    $sqlContent"
    
    # Préparation et envoi de la requête à Ollama
    $bodyObj = @{ model = "qwen2.5-coder:14b"; prompt = $prompt; stream = $false; temperature = 0.0 }
    $bodyJson = ConvertTo-Json -InputObject $bodyObj -Depth 5 -Compress
    
    Write-Host "Qwen2.5-Coder audite les structures de la base de données..."
    $response = Invoke-RestMethod -Uri "http://localhost:11434/api/generate" -Method Post -ContentType "application/json; charset=utf-8" -Body $bodyJson
    
    $auditResult = $response.response
    
    # Affichage du rapport d'audit complet de l'IA dans les logs de la console
    Write-Host "`n=== RAPPORT D'AUDIT IA ==="
    Write-Host $auditResult
    Write-Host "==========================`n"
    
    # GARANTIE DE L'EXISTENCE DU DOSSIER CIBLE
    $targetDir = "$(Build.SourcesDirectory)\scripts"
    if (!(Test-Path -Path $targetDir)) {
        New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
    }
    
    # ÉCRITURE DU RAPPORT SUR LE DISQUE
    $auditResult | Out-File -FilePath "$targetDir\rapport_audit.md" -Encoding utf8
    
    # Logique de contrôle DevOps pour bloquer ou accepter le build
    if ($auditResult -match "^VALIDE") {
        Write-Host "=== [SUCCESS] L'IA a validé le script SQL. Autorisation de déploiement accordée. ==="
    } else {
        Write-Error "=== [FAILLE TECHNIQUE DETECTEE] L'IA a refusé ce script SQL pour non-conformité. Déploiement annulé. ==="
        exit 1
    }
  displayName: "Audit de conformité et de sécurité SQL par IA"

# 2.5 PUBLICATION DE L'ARTEFACT
- task: PublishBuildArtifacts@1
  displayName: "Sauvegarde du Rapport d'Audit IA dans les Artefacts"
  condition: always() 
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)\scripts\rapport_audit.md'
    ArtifactName: 'Rapports-SecOps'
    publishLocation: 'Container'

# 3. ÉTAPE EXISTANTE : Déploiement final par SQLcl
- script: |
    echo === Configuration de l environnement Java ===
    set JAVA_HOME=C:\SQL Developer\sqldeveloper-26.2.0.186.2220-x64\sqldeveloper\jdk\jre
    set PATH=%JAVA_HOME%\bin;%PATH%
    echo === Debut du deploiement automatise Oracle ===
    C:\oracle-tools\sqlcl\bin\sql.exe %DB_USER%/%DB_PASSWORD%@%DB_HOST%:%DB_PORT%/%DB_SERVICE_NAME% @scripts/deploy_tables.sql
    echo === Fin du processus DevOps Oracle - Succes ===
  displayName: "Déploiement du schéma SQL sur Oracle Linux"
  env:
    DB_USER: $(DB_USER)
    DB_PASSWORD: $(DB_PASSWORD)
    DB_HOST: $(DB_HOST)
    DB_PORT: $(DB_PORT)
    DB_SERVICE_NAME: $(DB_SERVICE_NAME)

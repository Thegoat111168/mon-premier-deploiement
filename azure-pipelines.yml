trigger:
- main

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: "Récupération du code de structure de GitHub"

# Étape IA LOCALE Ollama avec le nom de fichier corrigé
- powershell: |
    Write-Host "=== Connexion a l'IA Locale Ollama ==="
    
    # 1. Alignement sur le nom réel de votre fichier sur GitHub
    $scriptPath = "$(Build.SourcesDirectory)\scripts\deploy_tables.sql"
    
    if (-not (Test-Path $scriptPath)) {
        Write-Error "Le fichier $scriptPath n'a pas été trouvé."
        exit 1
    }
    
    $sqlContent = Get-Content -Path $scriptPath -Raw
    
    # 2. Demande d'analyse au modèle Qwen local
    $prompt = "Tu es un expert DBA Oracle Senior. Analyse ce script de déploiement et génère exclusivement le script de rollback (retour en arrière) SQL inverse exact (DROP, DELETE, etc.). Ne mets aucun texte d'explication, pas de blabla, pas de balises Markdown (n'utilise pas de blocs de code avec triple accent grave). Renvoie uniquement le code SQL exécutable se terminant par EXIT;`n`nScript à analyser :`n$sqlContent"
    
    $bodyObj = @{
        model = "qwen2.5-coder:14b" 
        prompt = $prompt
        stream = $false
    }
    $bodyJson = ConvertTo-Json -InputObject $bodyObj -Depth 5 -Compress
    
    Write-Host "Qwen2.5-Coder génère le script de secours en local..."
    $response = Invoke-RestMethod -Uri "http://localhost:11434/api/generate" -Method Post -ContentType "application/json; charset=utf-8" -Body $bodyJson
    
    $rollbackSql = $response.response
    
    # 3. Sauvegarde automatique du rollback généré à côté du script principal
    $outputPath = "$(Build.SourcesDirectory)\scripts\rollback_mfa.sql"
    $rollbackSql | Out-File -FilePath $outputPath -Encoding utf8
    Write-Host "=== [SUCCESS] Le plan de secours a été généré par Ollama dans $outputPath ==="
  displayName: "Génération du plan de secours par IA Locale (Ollama)"

# Étape d'exécution SQLcl avec le nom de fichier corrigé
- script: |
    echo === Configuration de l environnement Java ===
    set JAVA_HOME=C:\SQL Developer\sqldeveloper-26.2.0.186.2220-x64\sqldeveloper\jdk\jre
    set PATH=%JAVA_HOME%\bin;%PATH%
    
    echo === Debut du deploiement automatise Oracle ===
    echo Connexion a la PDB %DB_SERVICE_NAME% sur la VM Linux (%DB_HOST%:%DB_PORT%) en cours...
    
    REM Appel de SQLcl ciblant le bon script deploy_tables.sql
    C:\oracle-tools\sqlcl\bin\sql.exe %DB_USER%/%DB_PASSWORD%@%DB_HOST%:%DB_PORT%/%DB_SERVICE_NAME% @scripts/deploy_tables.sql
    
    echo === Fin du processus DevOps Oracle - Succes ===
  displayName: "Déploiement du schéma SQL sur Oracle Linux"
  env:
    DB_USER: $(DB_USER)
    DB_PASSWORD: $(DB_PASSWORD)
    DB_HOST: $(DB_HOST)
    DB_PORT: $(DB_PORT)
    DB_SERVICE_NAME: $(DB_SERVICE_NAME)

trigger:
- main

pool:
  name: 'Default'

steps:
- checkout: self
  displayName: "Récupération du code GitHub"

# Étape B : Inspecter les dossiers avec la commande Windows
- script: |
   echo === Connexion sécurisée à la base de données ===
    echo Nous allons simuler une action sur Oracle.
    
    # Regardez bien la ligne ci-dessous : 
    # Le système va masquer automatiquement la variable avec des étoiles '***'
    echo "Le mot de passe utilisé en mémoire est : $(ORACLE_PASSWORD)"
    
    echo === Fin de l'action ===
    displayName: "Test du coffre-fort de secrets"
    env:
    # On transforme la variable Azure DevOps en variable d'environnement pour l'agent
    ORACLE_PASSWORD: $(ORACLE_PASSWORD)